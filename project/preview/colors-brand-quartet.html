<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:flex;gap:20px;align-items:center;justify-content:space-around;flex-wrap:wrap}
.q{display:flex;flex-direction:column;align-items:center;gap:8px}
.swatch{width:78px;height:78px;border-radius:50%;box-shadow:var(--shadow-sm)}
.lab{font-family:var(--font-mono);font-size:11px;color:var(--fg-subtle)}
.name{font-family:var(--font-body);font-size:13px;color:var(--fg);font-weight:600}
.logo{width:180px}
</style></head>
<body>
<img class="logo" src="../assets/logo-full.png" alt="GutHub">
<div class="q"><div class="swatch" style="background:#E87A6B"></div><div class="name">Coral</div><div class="lab">#E87A6B · eye</div></div>
<div class="q"><div class="swatch" style="background:#F2C94C"></div><div class="name">Yellow</div><div class="lab">#F2C94C · leaf</div></div>
<div class="q"><div class="swatch" style="background:#7FB77E"></div><div class="name">Green</div><div class="lab">#7FB77E · leaf</div></div>
<div class="q"><div class="swatch" style="background:#6FB8A8"></div><div class="name">Teal</div><div class="lab">#6FB8A8 · fork</div></div>
</body></html>
