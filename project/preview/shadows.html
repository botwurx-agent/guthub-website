<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.sh{width:140px;height:100px;background:#fff;border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}
.sh b{font-size:11px;color:var(--fg);font-weight:700;font-family:var(--font-body);margin-bottom:2px}
</style></head>
<body>
<div class="sh" style="box-shadow:var(--shadow-xs)"><b>xs</b>subtle hairline</div>
<div class="sh" style="box-shadow:var(--shadow-sm)"><b>sm</b>cards at rest</div>
<div class="sh" style="box-shadow:var(--shadow-md)"><b>md</b>cards on hover</div>
<div class="sh" style="box-shadow:var(--shadow-lg)"><b>lg</b>floating panel</div>
<div class="sh" style="box-shadow:var(--shadow-xl)"><b>xl</b>modal</div>
</body></html>
