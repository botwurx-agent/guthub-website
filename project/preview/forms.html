<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);display:flex;flex-direction:column;gap:14px;max-width:560px}
label{display:block;font-size:13px;font-weight:600;color:var(--fg);margin-bottom:6px}
.field{width:100%;padding:14px 16px;font-family:var(--font-body);font-size:16px;color:var(--fg);background:#fff;border:1px solid var(--border);border-radius:10px;outline:none;transition:all .2s var(--ease-out);box-sizing:border-box}
.field:focus{border-color:var(--terracotta-400);box-shadow:0 0 0 3px rgba(219,111,86,.2)}
.field.err{border-color:var(--error)}
.help{font-size:13px;color:var(--fg-muted);margin-top:4px}
.err-msg{font-size:13px;color:var(--error);margin-top:4px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--fg)}
.check input{margin-top:3px;accent-color:var(--terracotta-400);width:18px;height:18px}
</style></head>
<body>
<div><label>Email address</label><input class="field" placeholder="you@example.com" value="sarah@example.com"></div>
<div><label>Describe a symptom</label><input class="field" placeholder="e.g. bloating after dinner"><div class="help">Guthub never shares your data. Read our policy.</div></div>
<div><label>Password</label><input class="field err" type="password" value="••••"><div class="err-msg">Password must be at least 8 characters.</div></div>
<label class="check"><input type="checkbox" checked>I want ongoing tips and updates (about twice a month).</label>
</body></html>
