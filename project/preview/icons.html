<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;padding:22px;background:var(--bg);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.i{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg)}
.i svg{width:28px;height:28px;stroke-width:1.75}
.lab{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}
</style></head>
<body>
<div class="i"><i data-lucide="message-circle"></i><span class="lab">chat</span></div>
<div class="i"><i data-lucide="sparkles"></i><span class="lab">ai</span></div>
<div class="i"><i data-lucide="apple"></i><span class="lab">food</span></div>
<div class="i"><i data-lucide="activity"></i><span class="lab">track</span></div>
<div class="i"><i data-lucide="heart-pulse"></i><span class="lab">health</span></div>
<div class="i"><i data-lucide="shield-check"></i><span class="lab">secure</span></div>
<div class="i"><i data-lucide="leaf"></i><span class="lab">leaf</span></div>
<div class="i"><i data-lucide="arrow-right"></i><span class="lab">arrow</span></div>
<div class="i"><i data-lucide="check"></i><span class="lab">check</span></div>
<div class="i"><i data-lucide="clock"></i><span class="lab">clock</span></div>
<script>lucide.createIcons();</script>
</body></html>
