<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--bg);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo-light{background:var(--cream-100);padding:16px 24px;border-radius:14px;border:1px solid var(--border)}
.logo-dark{background:var(--forest-500);padding:16px 24px;border-radius:14px}
.logo-light img,.logo-dark img{height:44px;display:block}
.icon-only{background:#fff;width:76px;height:76px;border-radius:14px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.icon-only img{height:40px}
.lab{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);text-transform:uppercase;letter-spacing:.06em}
</style></head>
<body>
<div class="logo-light"><img src="../assets/logo-full.png" alt="GutHub"></div>
<div class="logo-dark"><img src="../assets/logo-full.png" alt="GutHub" style="filter:brightness(0) invert(1) sepia(.3) saturate(2)"></div>
<div class="icon-only"><img src="../assets/logo.png" alt=""></div>
<span class="lab">On cream · on forest (inverted wordmark) · icon only</span>
</body></html>
