<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border-radius:10px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--fg-inverse);font-family:var(--font-mono);font-size:10px;line-height:1.3;box-shadow:var(--shadow-xs)}
.sw .n{font-weight:700;font-size:11px}
.sw.light{color:var(--ink-900)}
</style></head>
<body>
<div class="sw" style="background:#FBEEE9" ><div class="n light" style="color:var(--ink-900)">terracotta-50</div><div class="light" style="color:var(--ink-600)">#FBEEE9</div></div>
<div class="sw light" style="background:#F5D5C9"><div class="n">-100</div><div>#F5D5C9</div></div>
<div class="sw light" style="background:#EEB3A0"><div class="n">-200</div><div>#EEB3A0</div></div>
<div class="sw" style="background:#E5917A"><div class="n">-300</div><div>#E5917A</div></div>
<div class="sw" style="background:#DB6F56"><div class="n">-400 · CTA</div><div>#DB6F56</div></div>
<div class="sw" style="background:#C85A44"><div class="n">-500 · hover</div><div>#C85A44</div></div>
<div class="sw" style="background:#A64732"><div class="n">-600</div><div>#A64732</div></div>
<div class="sw" style="background:#7F3424"><div class="n">-700 · ink</div><div>#7F3424</div></div>
<div class="sw light" style="background:#FDFAF3;border:1px solid var(--border)"><div class="n">cream-50 · bg</div><div>#FDFAF3</div></div>
<div class="sw light" style="background:#FAF5EE;border:1px solid var(--border)"><div class="n">cream-100</div><div>#FAF5EE</div></div>
</body></html>
