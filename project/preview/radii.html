<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:var(--bg);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.r{background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
.r b{color:var(--fg);font-family:var(--font-body);font-weight:700;margin-right:6px}
</style></head>
<body>
<div class="r" style="width:80px;height:60px;border-radius:6px"><b>sm</b>6</div>
<div class="r" style="width:90px;height:70px;border-radius:10px"><b>md</b>10</div>
<div class="r" style="width:110px;height:80px;border-radius:16px"><b>lg</b>16</div>
<div class="r" style="width:130px;height:90px;border-radius:24px"><b>xl</b>24</div>
<div class="r" style="width:150px;height:100px;border-radius:32px"><b>2xl</b>32</div>
<div class="r" style="width:120px;height:44px;border-radius:999px"><b>pill</b>999</div>
</body></html>
