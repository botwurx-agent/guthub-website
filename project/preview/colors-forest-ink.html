<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sw{border-radius:10px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--fg-inverse);font-family:var(--font-mono);font-size:10px;line-height:1.3}
.sw .n{font-weight:700;font-size:11px}
</style></head>
<body>
<div class="sw" style="background:#EEF3EF;color:var(--ink-900)"><div class="n">forest-50</div><div>#EEF3EF</div></div>
<div class="sw" style="background:#D5E0D8;color:var(--ink-900)"><div class="n">-100</div><div>#D5E0D8</div></div>
<div class="sw" style="background:#A9C1AE;color:var(--ink-900)"><div class="n">-200</div><div>#A9C1AE</div></div>
<div class="sw" style="background:#6F9477"><div class="n">-300</div><div>#6F9477</div></div>
<div class="sw" style="background:#3F6A4A"><div class="n">-400</div><div>#3F6A4A</div></div>
<div class="sw" style="background:#22432E"><div class="n">-500 · dark bg</div><div>#22432E</div></div>
<div class="sw" style="background:#1A3524"><div class="n">-600</div><div>#1A3524</div></div>
<div class="sw" style="background:#13271B"><div class="n">-700</div><div>#13271B</div></div>
<div class="sw" style="background:#1B1A17"><div class="n">ink-900 · text</div><div>#1B1A17</div></div>
<div class="sw" style="background:#5A564D"><div class="n">ink-600 · muted</div><div>#5A564D</div></div>
</body></html>
