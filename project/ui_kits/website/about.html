<script type="text/babel">
function AboutApp() {
  React.useEffect(() => {
    const id = setInterval(() => {
      if (!window.lucide) return;
      const pending = document.querySelectorAll('[data-lucide]');
      if (pending.length) window.lucide.createIcons();
    }, 300);
    return () => clearInterval(id);
  }, []);
  return <AboutPage />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AboutApp />);
</script>

<script type="text/babel">

// ===== Button.jsx =====
// Button.jsx — primary/secondary/dark/ghost variants. Pill-shaped.

function Button({ variant = 'primary', size = 'md', as = 'button', href, children, icon, style: userStyle, ...rest }) {
  const Tag = as === 'a' ? 'a' : 'button';
  const sz = size === 'lg' ? { padding: '18px 28px', fontSize: 17 } :
             size === 'sm' ? { padding: '10px 16px', fontSize: 14 } :
                             { padding: '14px 22px', fontSize: 15 };
  const base = {
    fontFamily: 'var(--font-body)', fontWeight: 600, borderRadius: 999,
    border: '1px solid transparent', cursor: 'pointer', lineHeight: 1,
    transition: 'all 240ms var(--ease-out)', display: 'inline-flex',
    alignItems: 'center', gap: 8, textDecoration: 'none', ...sz,
  };
  const variants = {
    primary: { background: 'var(--terracotta-400)', color: '#fff' },
    secondary: { background: 'transparent', borderColor: 'var(--ink-300)', color: 'var(--ink-900)' },
    dark: { background: 'var(--forest-500)', color: 'var(--cream-100)' },
    ghost: { background: 'transparent', color: 'var(--ink-900)' },
    inverse: { background: 'var(--cream-50)', color: 'var(--forest-600)' },
  };
  const [hover, setHover] = React.useState(false);
  const hov = hover ? {
    primary: { background: 'var(--terracotta-500)', boxShadow: 'var(--shadow-md)' },
    secondary: { background: 'var(--cream-100)', borderColor: 'var(--ink-900)' },
    dark: { background: 'var(--forest-600)', boxShadow: 'var(--shadow-md)' },
    ghost: { background: 'var(--cream-100)' },
    inverse: { background: '#fff', boxShadow: 'var(--shadow-md)' },
  }[variant] : {};
  return (
    <Tag href={href} style={{ ...base, ...variants[variant], ...hov, ...userStyle }}
         onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} {...rest}>
      {children}
      {icon}
    </Tag>
  );
}

window.Button = Button;


// ===== Badge.jsx =====
// Badge.jsx — small pill labels

function Badge({ tone = 'accent', dot = false, children }) {
  const tones = {
    accent: { bg: 'var(--terracotta-50)', fg: 'var(--terracotta-700)' },
    dark: { bg: 'var(--forest-500)', fg: 'var(--cream-100)' },
    soft: { bg: 'var(--cream-200)', fg: 'var(--ink-900)' },
    outline: { bg: 'transparent', fg: 'var(--ink-700)', border: '1px solid var(--ink-300)' },
  };
  const t = tones[tone];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '6px 12px', borderRadius: 999,
      fontSize: 12, fontWeight: 600, fontFamily: 'var(--font-body)',
      lineHeight: 1, background: t.bg, color: t.fg, border: t.border || 'none',
    }}>
      {dot && <span style={{
        width: 7, height: 7, borderRadius: '50%',
        background: 'var(--forest-300)',
        animation: 'pulse 1.6s infinite',
      }} />}
      {children}
    </span>
  );
}

function Eyebrow({ children, color }) {
  return <div style={{
    fontFamily: 'var(--font-body)', fontSize: 12, letterSpacing: '0.18em',
    textTransform: 'uppercase', fontWeight: 700,
    color: color || 'var(--terracotta-700)',
  }}>{children}</div>;
}

window.Badge = Badge;
window.Eyebrow = Eyebrow;


// ===== Header.jsx =====
// Header.jsx — sticky header with blurred cream background on scroll

function Header() {
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 12);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const navItems = [
    { label: 'Product', href: 'features.html' },
    { label: 'Pricing', href: 'pricing.html' },
    { label: 'FAQ', href: 'index.html#faq' },
    { label: 'About', href: 'about.html' },
  ];

  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 50,
      background: scrolled ? 'rgba(253, 250, 243, 0.82)' : 'transparent',
      backdropFilter: scrolled ? 'blur(12px)' : 'none',
      WebkitBackdropFilter: scrolled ? 'blur(12px)' : 'none',
      borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
      transition: 'all 240ms var(--ease-out)',
    }}>
      <div style={{
        maxWidth: 'var(--maxw-wide)', margin: '0 auto',
        padding: '14px 32px', display: 'flex', alignItems: 'center', gap: 32,
      }}>
        <a href="index.html" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
          <img src="../../assets/logo-full.png" alt="GutHub" style={{ height: 32 }} />
        </a>
        <nav style={{ display: 'flex', gap: 28, marginLeft: 16 }}>

              fontWeight: 500, fontFamily: 'var(--font-body)',

              {item.label}

          <a href="#" onClick={e => { e.preventDefault(); window.dispatchEvent(new CustomEvent('open-auth', { detail: { mode: 'signin' } })); }} style={{

// ===== AuthModal.jsx =====
// AuthModal.jsx — sign-up / sign-in modal
// Opens via window.dispatchEvent(new CustomEvent('open-auth', { detail: { mode: 'signup' | 'signin' } }))

function AuthModal() {
  const [open, setOpen] = React.useState(false);
  const [mode, setMode] = React.useState('signup');

  React.useEffect(() => {
    const onOpen = (e) => {
      setMode((e.detail && e.detail.mode) || 'signup');
      setOpen(true);
    };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('open-auth', onOpen);
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('open-auth', onOpen);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  React.useEffect(() => {
    document.body.style.overflow = open ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  if (!open) return null;

  const isSignup = mode === 'signup';

  return (
    <div
      onClick={() => setOpen(false)}
      style={{
        position: 'fixed', inset: 0, zIndex: 1000,
        background: 'rgba(31, 45, 42, 0.55)',
        backdropFilter: 'blur(8px)',
        WebkitBackdropFilter: 'blur(8px)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: 24,
        animation: 'authFadeIn 200ms var(--ease-out)',
      }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          background: 'var(--cream-50)',
          width: '100%', maxWidth: 440,
          borderRadius: 'var(--radius-2xl)',
          boxShadow: '0 40px 80px -20px rgba(31, 45, 42, 0.5)',
          overflow: 'hidden',
          animation: 'authPopIn 280ms var(--ease-out)',
          position: 'relative',
        }}
      >
        {/* close button */}
        <button
          onClick={() => setOpen(false)}
          aria-label="Close"
          style={{
            position: 'absolute', top: 16, right: 16,
            width: 34, height: 34, borderRadius: '50%',
            border: 'none', background: 'transparent', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'var(--ink-600)', zIndex: 2,
          }}
          onMouseEnter={e => { e.currentTarget.style.background = 'var(--cream-100)'; e.currentTarget.style.color = 'var(--ink-900)'; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--ink-600)'; }}
        >
          <i data-lucide="x" style={{ width: 18, height: 18 }}></i>
        </button>

        <div style={{ padding: '36px 36px 28px' }}>
          {/* logo */}
          <img src="../../assets/logo-full.png" alt="GutHub" style={{ height: 26, marginBottom: 20 }} />

          {/* title */}
          <h2 style={{
            fontFamily: 'var(--font-display)',
            fontSize: 26, fontWeight: 400, lineHeight: 1.22,
            letterSpacing: '-0.02em', color: 'var(--ink-900)',
            margin: '0 0 8px',
          }}>
            {isSignup ? <>Start your <em style={{ fontStyle: 'italic', color: 'var(--terracotta-500)' }}>2-day free trial</em></> : <>Welcome back.</>}
          </h2>
          <p style={{ fontSize: 14.5, color: 'var(--ink-600)', margin: '0 0 24px', lineHeight: 1.5 }}>
            {isSignup
              ? 'Full access to every feature. Cancel anytime.'
              : 'Sign in to continue your journey.'}
          </p>

          {/* Google button */}
          <GoogleButton label={isSignup ? 'Continue with Google' : 'Sign in with Google'} />

          {/* divider */}
          <div style={{
            display: 'flex', alignItems: 'center', gap: 12,
            margin: '20px 0', fontSize: 12, color: 'var(--ink-500)',
            textTransform: 'uppercase', letterSpacing: '0.1em',
          }}>
            <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
            <span>{isSignup ? 'or sign up with email' : 'or with email'}</span>
            <div style={{ flex: 1, height: 1, background: 'var(--border)' }} />
          </div>

          {/* form fields */}
          <form onSubmit={e => e.preventDefault()} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {isSignup && (
              <Field label="Name" type="text" placeholder="Alex Morgan" autoComplete="name" />
            )}
            <Field label="Email" type="email" placeholder="you@example.com" autoComplete="email" />
            <Field
              label="Password"
              type="password"
              placeholder={isSignup ? 'At least 8 characters' : 'Your password'}
              autoComplete={isSignup ? 'new-password' : 'current-password'}
              extra={!isSignup && (
                <a href="#" onClick={e => e.preventDefault()} style={{
                  fontSize: 12, color: 'var(--terracotta-500)', textDecoration: 'none', fontWeight: 500,
                }}>Forgot?</a>
              )}
            />

            <button type="submit" style={{
              marginTop: 8,
              padding: '14px 20px',
              background: 'var(--terracotta-400)', color: '#fff',
              border: 'none', borderRadius: 999, cursor: 'pointer',
              fontFamily: 'var(--font-body)', fontSize: 15, fontWeight: 600,
              transition: 'background 200ms, box-shadow 200ms',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = 'var(--terracotta-500)'; e.currentTarget.style.boxShadow = 'var(--shadow-md)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'var(--terracotta-400)'; e.currentTarget.style.boxShadow = 'none'; }}
            >
              {isSignup ? 'Create account · Start 2-day trial' : 'Sign in'}
            </button>
          </form>

          {/* toggle link */}
          <div style={{
            textAlign: 'center', marginTop: 20, fontSize: 14, color: 'var(--ink-600)',
          }}>
            {isSignup ? 'Already have an account? ' : 'New to Guthub? '}
            <a href="#" onClick={e => { e.preventDefault(); setMode(isSignup ? 'signin' : 'signup'); }}
              style={{ color: 'var(--terracotta-500)', textDecoration: 'none', fontWeight: 600 }}>
              {isSignup ? 'Sign in' : 'Create an account'}
            </a>
          </div>
        </div>

        {/* footer */}
        {isSignup && (
          <div style={{
            padding: '14px 36px', background: 'var(--cream-100)',
            borderTop: '1px solid var(--border)',
            fontSize: 12, color: 'var(--ink-600)', lineHeight: 1.5, textAlign: 'center',
          }}>
            By continuing you agree to our <a href="#" style={{ color: 'var(--ink-800)', fontWeight: 500 }}>Terms</a> and <a href="#" style={{ color: 'var(--ink-800)', fontWeight: 500 }}>Privacy Policy</a>.
          </div>
        )}
      </div>

      <style>{`
        @keyframes authFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes authPopIn {
          from { opacity: 0; transform: translateY(16px) scale(0.96); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
      `}</style>
    </div>
  );
}

function Field({ label, type, placeholder, autoComplete, extra }) {
  const [focus, setFocus] = React.useState(false);
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-700)', letterSpacing: '0.02em' }}>

      <input
        type={type}
        placeholder={placeholder}
        autoComplete={autoComplete}
        onFocus={() => setFocus(true)}

        style={{
          padding: '12px 14px',
          background: '#fff',
          border: `1px solid ${focus ? 'var(--terracotta-400)' : 'var(--border)'}`,
          borderRadius: 10,
          fontSize: 15, fontFamily: 'var(--font-body)',
          color: 'var(--ink-900)',
          outline: 'none',
          transition: 'border-color 160ms, box-shadow 160ms',
          boxShadow: focus ? '0 0 0 3px rgba(224,124,89,0.15)' : 'none',

      />

  );
}

function GoogleButton({ label }) {
  return (
    <button
      style={{
        width: '100%', padding: '12px 18px',
        background: '#fff', border: '1px solid var(--border)',
        borderRadius: 999, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
        fontFamily: 'var(--font-body)', fontSize: 15, fontWeight: 600,
        color: 'var(--ink-900)',
        transition: 'background 160ms, border-color 160ms, box-shadow 160ms',
      }}
      onMouseEnter={e => { e.currentTarget.style.background = 'var(--cream-100)'; e.currentTarget.style.boxShadow = 'var(--shadow-sm)'; }}
      onMouseLeave={e => { e.currentTarget.style.background = '#fff'; e.currentTarget.style.boxShadow = 'none'; }}
    >
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      {label}
    </button>
  );
}

window.AuthModal = AuthModal;


// ===== MotionPrimitives.jsx =====
// Lightweight, respects prefers-reduced-motion.

// --- Reveal ---
// Fades + lifts children into view when they enter the viewport.
// Props: as, delay (ms), y (px lift), duration (ms), threshold
function Reveal({ as = 'div', delay = 0, y = 16, duration = 700, threshold = 0.15, once = true, children, style, ...rest }) {
  const Tag = as;
  const ref = React.useRef(null);
  const [shown, setShown] = React.useState(false);
  const reduced = React.useRef(false);

  React.useEffect(() => {
    reduced.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced.current) { setShown(true); return; }
    const el = ref.current;
    if (!el) return;
    // If element is already in viewport at mount, trigger on next frame (preserves animation, avoids observer race)
    const rect = el.getBoundingClientRect();
    const inView = rect.top < window.innerHeight && rect.bottom > 0;
    if (inView) {
      // Microtask: React commits the opacity:0 render first, then flips to shown
      // (plays the fade-in). Fallback setTimeout in case microtask is skipped.
      let cancelled = false;
      Promise.resolve().then(() => { if (!cancelled) setShown(true); });
      const t = setTimeout(() => { if (!cancelled) setShown(true); }, 50);
      return () => { cancelled = true; clearTimeout(t); };
    }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          setShown(true);
          if (once) io.unobserve(el);
        } else if (!once) {
          setShown(false);
        }
      });
    }, { threshold, rootMargin: '0px 0px -40px 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, [threshold, once]);

  const motionStyle = {
    opacity: shown ? 1 : 0,
    transform: shown ? 'translateY(0)' : `translateY(${y}px)`,
    transition: `opacity ${duration}ms var(--ease-out) ${delay}ms, transform ${duration}ms var(--ease-out) ${delay}ms`,
    willChange: 'opacity, transform',
  };

  return React.createElement(Tag, { ref, style: { ...motionStyle, ...(style || {}) }, ...rest }, children);
}

// --- RevealStagger ---
// Animates children sequentially. Wrap a list-like container.
function RevealStagger({ children, step = 80, initialDelay = 0, y = 14, duration = 650, style, ...rest }) {
  return (
    <div style={style} {...rest}>
      {React.Children.map(children, (child, i) => (
        <Reveal delay={initialDelay + i * step} y={y} duration={duration} style={{ display: 'contents' }}>
          {child}
        </Reveal>
      ))}
    </div>
  );
}

// --- SectionDivider ---
// Soft organic shape that peeks out of a section edge, marking a transition.
// variants: 'leaf', 'splash', 'wave'
function SectionDivider({ variant = 'leaf', color = 'var(--terracotta-300)', side = 'top', offset = -40 }) {
  const paths = {
    leaf: (
      // Organic leaf/brushstroke
      <svg viewBox="0 0 120 120" width="100" height="100" style={{ display: 'block', filter: 'drop-shadow(0 6px 16px rgba(219,111,86,0.25))' }}>
        <path
          d="M60 10 C 90 20, 112 50, 105 85 C 98 100, 80 110, 60 112 C 35 110, 18 95, 12 70 C 10 40, 30 15, 60 10 Z"
          fill={color}
          opacity="0.92"
        />
        <path
          d="M60 18 C 62 50, 70 75, 85 100"
          stroke="rgba(255,255,255,0.35)"
          strokeWidth="1.5"
          fill="none"
          strokeLinecap="round"
        />
      </svg>
    ),
    splash: (
      <svg viewBox="0 0 140 100" width="140" height="100" style={{ display: 'block' }}>
        <path
          d="M10 70 C 20 40, 40 30, 60 45 C 75 55, 85 40, 100 50 C 115 55, 125 70, 120 85 C 100 92, 70 90, 50 85 C 25 80, 5 85, 10 70 Z"
          fill={color}
          opacity="0.85"
        />
      </svg>
    ),
    wave: (
      <svg viewBox="0 0 200 40" width="200" height="40" style={{ display: 'block' }}>
        <path
          d="M0 20 Q 25 5, 50 20 T 100 20 T 150 20 T 200 20 V 40 H 0 Z"
          fill={color}
        />
      </svg>
    ),
  };
  const pos = side === 'top'
    ? { top: offset, left: '50%', transform: 'translateX(-50%) rotate(-8deg)' }
    : { bottom: offset, left: '50%', transform: 'translateX(-50%) rotate(172deg)' };
  return (
    <div aria-hidden style={{
      position: 'absolute', ...pos, pointerEvents: 'none', zIndex: 3,
    }}>
      {paths[variant]}
    </div>
  );
}

Object.assign(window, { Reveal, RevealStagger, SectionDivider });
